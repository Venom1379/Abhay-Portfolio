<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abhay Patel | Web Developer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    max-width:800px;
    width:100%;
    background:#1e293b;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.profile-img{
    width:140px;
    height:140px;
    border-radius:50%;
    background:#334155;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:50px;
    font-weight:bold;
    border:4px solid #38bdf8;
}

h1{
    margin-top:20px;
    font-size:38px;
}

.role{
    color:#38bdf8;
    font-size:22px;
    margin-top:10px;
}

.exp{
    margin-top:15px;
    font-size:18px;
}

.info{
    margin-top:30px;
}

.info p{
    margin:10px 0;
    font-size:18px;
}

.skills{
    margin-top:35px;
}

.skills h2{
    margin-bottom:20px;
}

.skill-list{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
}

.skill{
    background:#38bdf8;
    color:#000;
    padding:10px 18px;
    border-radius:30px;
    font-weight:bold;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:12px 25px;
    background:#38bdf8;
    color:#000;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

footer{
    margin-top:30px;
    color:#94a3b8;
}
</style>
</head>
<body>

<div class="container">

    <div class="profile-img">AP</div>

    <h1>Abhay Patel</h1>
    <p class="role">Web Developer</p>

    <p class="exp">
        Experience: <span id="experience">4+</span> Years
    </p>

    <div class="info">
        <p>📞 9106559022</p>
        <p>📧 abhaypatel07578@gmail.com</p>
    </div>

    <div class="skills">
        <h2>Tech Stack</h2>

        <div class="skill-list">
            <div class="skill">WordPress</div>
            <div class="skill">Laravel</div>
            <div class="skill">CodeIgniter 3</div>
            <div class="skill">Node.js</div>
            <div class="skill">JavaScript</div>
        </div>
    </div>

    <a href="mailto:abhaypatel07578@gmail.com" class="btn">
        Contact Me
    </a>

    <footer>
        © <span id="year"></span> Abhay Patel. All Rights Reserved.
    </footer>

</div>

<script>
document.getElementById("year").textContent =
new Date().getFullYear();
</script>

</body>
</html>
